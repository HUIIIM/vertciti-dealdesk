<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealDesk · 房地产交易核保台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/vc-product.css">
<style>/* vc-product 兼容复位：本页沿用既有深色工作台主题，body 基础色/字体在此复位为本页原值，避免 DNA 浅色 body 规则破坏深色组件对比度；品牌条/主栏/组件层走 vc-product.css */body.vc{background:var(--bg0);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px}.vc-top{color:#000}</style>
</head>
<body class="vc">
<!-- vc-product DNA 壳：黑色品牌条 vc-util + 白色主栏 vc-top（官方 SVG Logo）；本页功能条/结构与 JS 绑定原样保留 -->
<div class="vc-util"><a href="https://vertciti.com"><img src="/assets/vertciti-logo-reversed-white.svg" alt="vertciti" style="height:16px;width:auto"></a><a href="/" aria-current="page">DealDesk</a><span style="flex:1"></span><a href="https://vertciti.com/trust/">仿冒预警</a></div>
<header class="vc-top" style="position:static"><a class="logo" href="/" aria-label="vertciti"><img src="/assets/vertciti-logo-primary-black.svg" alt="vertciti" style="height:24px;width:auto;display:block"></a><span class="prod">DealDesk</span></header>
<script src="/legacy-readonly.js"></script>
<div style="background:#13202B;border-bottom:1px solid #2DD4BF;color:#E9EFF9;font-size:13px;padding:8px 16px;text-align:center">统一结论口径：值得买 · BUY / 再看看 · HOLD / 别碰 · PASS（一票否决 · VETO 为独立第 4 状态）</div>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand"><span class="logo"><img src="/assets/vertciti-logo-reversed-white.svg" alt="vertciti" style="height:20px;width:auto;display:block"></span><span class="bt">DealDesk<small>房地产交易核保台</small></span></div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="on"><span class="ni">◈</span>仪表盘</button>
      <button data-view="intake"><span class="ni">⬡</span>智能搜集</button>
      <button data-view="form"><span class="ni">＋</span>新建项目</button>
      <button data-view="compare"><span class="ni">◫</span>项目对比 <em id="cmpCount"></em></button>
      <a href="/workbench.html" target="_blank"><span class="ni">↗</span>全面分析工作台</a>
      <a href="/uw-commercial.html" target="_blank"><span class="ni">▦</span>商业核保</a>
    </nav>
    <div class="side-foot">
      <div class="tophap" id="tophapChip"><span class="dot"></span><span>TopHap 采集中…</span></div>
      <div class="ver">评分口径 buyer-box v2.3 / commercial v1.3</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="intake-hero">
        <span class="ih-label">房源直达</span>
        <div class="ih-wrap">
          <input id="ihInput" type="text" placeholder="粘贴链接、输入地址或命令 · Paste a link, address, or command…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="ihChip" aria-autocomplete="list">
          <div id="ihChip" class="ih-chip" hidden role="listbox" aria-live="polite"></div>
        </div>
        <button class="btn primary" id="ihGo">开始搜集</button>
      </div>
      <div class="top-right"><span class="clock" id="clock"></span></div>
    </header>
    <div class="demo-banner" id="demoBanner" hidden>
      <span class="db-tag">演示数据</span>
      <span>当前项目为演示数据，仅用于展示界面。正式核保请用「新建项目」录入真实交易——真钱的事，别拿演示数据练手。</span>
      <button id="demoClose" title="关闭">✕</button>
    </div>
    <main id="app"></main>
    <footer class="foot">筛选辅助工具，不构成投资建议。自动搜集字段均标注来源与可信度，卖方口径数字不直接采信。</footer>
  </div>
</div>
<script>
/* 演示横幅关闭按钮；显示/隐藏由 app.js refreshDemoBanner 按数据决定 */
document.getElementById('demoClose').addEventListener('click', function () {
  document.getElementById('demoBanner').hidden = true;
  try { localStorage.setItem('dd_demo_dismissed', '1'); } catch (e) {}
});
</script>
<script src="/app.js"></script>
</body>
</html>
