<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealDesk · 买房决策单页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/d.css">
</head>
<body>
<!-- Zone 0 顶栏 -->
<header class="z0"><div class="z0-in">
  <span class="addr" id="z0Addr">—</span>
  <span class="typetag" id="z0Type">—</span>
  <span class="stamp" id="z0Stamp"></span>
  <div class="actions">
    <button class="btn ghost" id="btnToggle" title="切换住宅/商业视角">切换视角</button>
    <div class="dd" id="ddPdf">
      <button class="btn" id="btnPdf" aria-haspopup="true">导出 PDF ▾</button>
      <div class="dd-menu" role="menu">
        <button id="btnPdfMemo">投资备忘录 PDF（模板版）</button>
        <button id="btnPrint">页面原样打印</button>
      </div>
    </div>
    <button class="btn" id="btnXlsx">导出 Excel</button>
  </div>
</div></header>
<div id="stickyV"><span class="sv-word" id="svWord">—</span><span id="svMeta">—</span>
  <button class="btn" id="svExport">导出</button></div>

<main class="wrap">
  <p class="howto" id="howto">怎么看这页：<b>先看结论</b>（值得买/再看看/别碰）· <b>再看价格证据</b>（Zone 3）· <b>最后看假设</b>（Zone 7，可改数重算）</p>

  <!-- loading -->
  <section class="zone" id="zLoad"><h2>正在分析</h2>
    <div class="steps" id="loadSteps"></div>
  </section>

  <!-- Zone 1 -->
  <section class="z1" id="z1" hidden>
    <div>
      <p class="verdict-word" id="vWord">—</p>
      <p class="one-liner" id="vOne"></p>
      <div class="conf-row">
        <div class="conf-bar"><div class="conf-fill" id="vConfFill" style="width:0%"></div></div>
        <span id="vConfNum">—</span>
      </div>
      <p class="conf-note">置信度 = 证据质量分（0-100），不是推荐强度：它回答"证据有多硬"，不回答"该不该买"。<span id="vConfLabel"></span></p>
      <p class="vrange" id="vRange"></p>
      <p class="cashneed" id="vCash"></p>
      <div id="vVetoes"></div>
      <div id="vReasons"></div>
      <p class="usage" id="vUsage"></p>
    </div>
    <div>
      <p class="note" style="margin-top:0">数据来源图例（常驻）</p>
      <div class="legend">
        <span class="src g"><i></i>实数已验证</span>
        <span class="src y"><i></i>估算待核验</span>
        <span class="src w"><i></i>待接数据源</span>
      </div>
      <p class="note">角标 <span class="pf">PF</span> = 基于卖方预测（pro forma），非实数。</p>
      <div id="z1Gaps"></div>
    </div>
  </section>

  <!-- Zone 2 -->
  <section id="z2" class="z2" hidden></section>

  <!-- Zone 3 -->
  <section class="zone" id="z3" hidden>
    <button class="acc-head" data-acc="z3"><h2>价格公不公允</h2><span class="chev">▾</span></button>
    <div class="acc-body" id="z3Body"></div>
  </section>

  <!-- Zone 4 + 5 -->
  <div class="z45">
    <section class="zone" id="z4" hidden>
      <button class="acc-head" data-acc="z4"><h2>现金流构成</h2><span class="chev">▾</span></button>
      <div class="acc-body" id="z4Body"></div>
    </section>
    <section class="zone" id="z5" hidden>
      <button class="acc-head" data-acc="z5"><h2>市场水温</h2><span class="chev">▾</span></button>
      <div class="acc-body" id="z5Body"></div>
    </section>
  </div>

  <!-- Zone 6 -->
  <section class="zone" id="z6" hidden>
    <button class="acc-head" data-acc="z6"><h2>未来估价会是多少 <span class="tag exp">趋势外推（实验）</span></h2><span class="chev">▾</span></button>
    <div class="acc-body" id="z6Body"></div>
  </section>

  <!-- Zone 7 -->
  <section class="zone" id="z7" hidden>
    <button class="acc-head" data-acc="z7"><h2>假设与明细</h2><span class="chev">▾</span></button>
    <div class="acc-body" id="z7Body"></div>
  </section>

  <p class="note" style="margin-top:24px">筛选辅助工具，不构成投资建议。估值永远是区间，不给单点数字。comps 只是起点，出价前请核验相似度/日期/位置/成色/市场动向。</p>
</main>
<div id="toast"></div>
<script src="/d.js"></script>
</body>
</html>
