[project]
name = "vertciti-dealdesk"
version = "2.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 等价于 AGENTS.md 里的 PYTHONPATH=.：本机直接 pytest 不再 ModuleNotFoundError
pythonpath = ["."]
markers = ["sqlite_only: 直接检查 SQLite 库文件的测试（Postgres 插件下跳过）"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["static", "assets", "tools"]

[tool.ruff.lint]
# 第一阶段：只开“真错误”类规则（未定义名、未用导入、语法、bugbear 高危项），不改风格
select = ["E9", "F63", "F7", "F82", "F401", "F811", "B006", "B008"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的惯用写法（参数默认值里调 File()/Form()/Query()），不是 B008 真错误
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# v2 新代码：mypy 严格模式（阻塞）。v1 模块由金标准锁定，类型化按 ENGINEERING.md 第 5 步渐进推进。
[[tool.mypy.overrides]]
module = ["app.domain.v2.*", "app.services.v2.*", "app.api.v2.*", "app.core.*", "app.services.persistence.*", "app.paths"]
strict = true
# 调用 v1 计算引擎（未标注、口径锁定）不可避免：只放开这一项
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["app.services.persistence.migrations.*"]
ignore_errors = true
