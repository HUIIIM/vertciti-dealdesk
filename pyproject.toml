[project]
name = "vertciti-dealdesk"
version = "1.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 等价于 AGENTS.md 里的 PYTHONPATH=.：本机直接 pytest 不再 ModuleNotFoundError
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["static", "assets", "tools"]

[tool.ruff.lint]
# 第一阶段：只开“真错误”类规则（未定义名、未用导入、语法、bugbear 高危项），不改风格
select = ["E9", "F63", "F7", "F82", "F401", "F811", "B006", "B008"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的惯用写法（参数默认值里调 File()/Form()/Query()），不是 B008 真错误
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
