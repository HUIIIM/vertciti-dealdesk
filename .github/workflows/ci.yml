# Source idea: actions/starter-workflows (CI concept). Tailored for vertciti-dealdesk.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # tests-only: 6 个测试文件用 PyMuPDF 生成/断言 PDF（app 生产代码用 pypdf，见 D2），不进 requirements.txt 以免污染生产 bundle
          pip install "PyMuPDF==1.28.2"
      - name: Run tests
        run: |
          # 开发副产品 dealdesk.db（gitignored）与测试 DB 隔离有已知串扰，
          # 跑全量测试前先删，确保用干净 DB。
          rm -f dealdesk.db
          pytest -q
