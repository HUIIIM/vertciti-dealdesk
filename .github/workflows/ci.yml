# Source idea: actions/starter-workflows (CI concept). Tailored for vertciti-dealdesk.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          # 开发副产品 dealdesk.db（gitignored）与测试 DB 隔离有已知串扰，
          # 跑全量测试前先删，确保用干净 DB。
          rm -f dealdesk.db
          pytest -q
