# Source idea: actions/starter-workflows (CI concept). Tailored for vertciti-dealdesk.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # 测试依赖（含 PyMuPDF、hypothesis）集中在 requirements-dev.txt，不进生产 bundle
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          # 开发副产品 dealdesk.db（gitignored）与测试 DB 隔离有已知串扰，
          # 跑全量测试前先删，确保用干净 DB。
          rm -f dealdesk.db
          pytest -q
