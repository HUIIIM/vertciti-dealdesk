# 静态安全分析（SAST）：Python 后端 + TypeScript 前端；PR、main 推送与每周定时。vertciti 标准 SEC-3。
# 私有仓需 GitHub Advanced Security 才能做代码扫描，私有时跳过。
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - static/app        # 前端构建产物（源码在 frontend/src 已分析）
              - frontend/src/api/schema.d.ts
              - tests/golden_v1
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
