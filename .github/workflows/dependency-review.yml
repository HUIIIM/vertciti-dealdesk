# Blocks PRs that add dependencies with known high/critical CVEs or copyleft licenses. vertciti standard SEC-4.
name: Dependency Review
on: [pull_request]
permissions:
  contents: read
jobs:
  review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5 # v5 (no bare major tag upstream; pinned to v5.0.0)
        with:
          fail-on-severity: high
          deny-licenses: "GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0"
