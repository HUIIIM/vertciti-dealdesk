# OpenSSF Scorecard: supply-chain posture, published to scorecard.dev. vertciti standard SEC-5.
# SARIF upload needs code scanning, so the job is skipped on private repos.
name: Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
