name: Claude Code

# Trigger path for the Claude direct loop (installed 2026-11-01): the
# repo-owned workflow for jarvis-task execution. Credential: the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (subscription OAuth route,
# chairman order 2026-11-01). The Claude GitHub App's managed runs do not
# consume repo secrets, so this workflow is the operative path.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Direct prompt for Claude Code (dispatch path)'
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.prompt }}
          # Tool allowlist (run 41365340458 had permission_denials_count=3 and
          # landed no artifacts): Write/Edit = create the deliverable files,
          # Bash(git:*) = branch/commit/push, Bash(gh:*) = open PR + comment.
          claude_args: --allowedTools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(gh:*)"
