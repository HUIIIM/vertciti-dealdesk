# Source: gitleaks/gitleaks-action (GitHub Marketplace) usage example.
# Gitleaks detects hardcoded secrets in git history and new commits. Free on all repos.
name: Secret scan (gitleaks)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read   # PR 扫描要列出 PR 的提交
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 扫描 PR 必需
          GITLEAKS_CONFIG: .gitleaks.toml              # 该 action 不认 config-path 输入，配置走环境变量
