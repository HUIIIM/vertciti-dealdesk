# SBOM (SEC-A5, backlog #31): generate a CycloneDX SBOM from the pinned
# production dependency lock and archive it as a workflow artifact.
name: SBOM
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Verify the lock installs reproducibly
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip check
      - name: Generate SBOM from the lock
        run: python tools/generate_sbom.py --requirements requirements.lock.txt --output sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dealdesk-sbom
          path: sbom.cdx.json
          retention-days: 90
