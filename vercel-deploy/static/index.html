<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DealDesk · 房地产交易核保台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">D</span><span class="bt">DealDesk<small>房地产交易核保台</small></span></div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="on"><span class="ni">◈</span>仪表盘</button>
      <button data-view="intake"><span class="ni">⬡</span>智能搜集</button>
      <button data-view="form"><span class="ni">＋</span>新建项目</button>
      <button data-view="compare"><span class="ni">◫</span>项目对比 <em id="cmpCount"></em></button>
      <a href="/workbench.html" target="_blank"><span class="ni">↗</span>全面分析工作台</a>
      <a href="/uw-commercial.html" target="_blank"><span class="ni">▦</span>商业核保</a>
    </nav>
    <div class="side-foot">
      <div class="tophap" id="tophapChip"><span class="dot"></span><span>TopHap 检测中…</span></div>
      <div class="ver">评分口径 buyer-box v2.3 / commercial v1.3</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="intake-hero">
        <span class="ih-label">房源直达</span>
        <input id="ihInput" type="text" placeholder="粘贴 Zillow / Redfin / LoopNet / Realtor 房源链接，或输入地址，一键搜集 → 自动填满仪表盘" autocomplete="off" spellcheck="false">
        <select id="ihTrack" title="核保轨道">
          <option value="residential">住宅</option>
          <option value="commercial">商业</option>
        </select>
        <button class="btn primary" id="ihGo">开始搜集</button>
      </div>
      <div class="top-right"><span class="clock" id="clock"></span></div>
    </header>
    <div class="demo-banner" id="demoBanner" hidden>
      <span class="db-tag">演示数据</span>
      <span>当前项目为演示数据，用于展示界面。正式核保请用「新建项目」录入真实交易。</span>
      <button id="demoClose" title="关闭">✕</button>
    </div>
    <main id="app"></main>
    <footer class="foot">筛选辅助工具，不构成投资建议。自动搜集字段均标注来源与可信度，卖方口径数字不直接采信。</footer>
  </div>
</div>
<script>
/* 演示横幅关闭按钮；显示/隐藏由 app.js refreshDemoBanner 按数据决定 */
document.getElementById('demoClose').addEventListener('click', function () {
  document.getElementById('demoBanner').hidden = true;
  try { localStorage.setItem('dd_demo_dismissed', '1'); } catch (e) {}
});
</script>
<script src="/app.js"></script>
</body>
</html>
